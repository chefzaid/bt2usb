# bt2usb's in-tree copy of the archived `bare-metal` 0.2.5, which cortex-m 0.7
# still depends on (README.bt2usb.md, docs/adr/0031-vendored-bare-metal.md).
# `src/lib.rs` is the crates.io release's file, unchanged. The release's
# `build.rs` and its `rustc_version` build-dependency are left out: the script
# only set a cfg for rustc older than 1.31, which `src/lib.rs` never reads.
[package]
name = "bare-metal"
version = "0.2.5"
edition = "2015"
authors = ["Jorge Aparicio <jorge@japaric.io>"]
description = "Abstractions common to bare metal systems"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rust-embedded/bare-metal"
publish = false

[features]
const-fn = [] # Unused, but kept for backwards compatibility (cortex-m enables it)
