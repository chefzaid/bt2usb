name: CI

# Build, lint, test, and (on tags) release the bt2usb firmware.
# `mask ci` runs local code checks; CI adds audit, simulation and release packaging.

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  # Keep release artifacts at info level; use DEFMT_LOG=debug for bring-up.
  DEFMT_LOG: info
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  # Formatting + host-side unit/integration tests (the pure logic cores).
  lint-and-test:
    name: Host tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Check formatting
        run: cargo fmt --package bt2usb -- --check
      - name: Keep Rust source files within 500 lines
        if: runner.os == 'Linux'
        run: |
          over=$(find src tests build.rs -name '*.rs' -exec wc -l {} + | awk '$2 != "total" && $1 > 500')
          if [ -n "$over" ]; then
            echo "Split these files below 500 lines (docs/code-quality.md#file-length):"
            echo "$over"
            exit 1
          fi
      - name: Test release consistency and artifact integrity helpers
        run: python -m unittest discover -s scripts -p "release_test.py" -v
      # install-action has no actionlint manifest; its cargo-binstall fallback
      # looks for a nonexistent crate. Fetch the upstream release, pinned by digest.
      - name: Install workflow linter
        if: runner.os == 'Linux'
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - name: Validate GitHub Actions workflow
        if: runner.os == 'Linux'
        run: actionlint
      - name: Require tag to match Cargo package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/release.py validate-tag --tag "$RELEASE_TAG"
        shell: bash
      - name: Run host unit + integration tests
        run: cargo test --locked --lib --tests
      - name: Clippy (host, deny warnings)
        run: cargo clippy --locked --lib --tests -- -D warnings
      - name: Build host documentation (deny warnings)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --document-private-items --lib

  # Line coverage of the host-tested pure core (docs/code-quality.md#coverage).
  # The report uploads before the floor is checked, so a drop can be read.
  coverage:
    name: Host coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Baseline: 97.59% of lines on 2026-10-10 (docs/testing.md#validation-record--2026-10-10).
      # Raise the floor as coverage grows; lower it only with a reason in the commit.
      COVERAGE_MIN_LINES: 97
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain + LLVM tools
        run: |
          rustup show active-toolchain
          rustup component add llvm-tools
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Run host tests with coverage instrumentation
        run: cargo llvm-cov --locked --lib --tests --no-report
      - name: Write summary, lcov, and HTML reports
        run: |
          mkdir -p "$RUNNER_TEMP/coverage"
          cargo llvm-cov report --summary-only | tee "$RUNNER_TEMP/coverage/summary.txt"
          cargo llvm-cov report --lcov --output-path "$RUNNER_TEMP/coverage/lcov.info"
          cargo llvm-cov report --html --output-dir "$RUNNER_TEMP/coverage"
      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report-${{ github.run_attempt }}
          path: ${{ runner.temp }}/coverage
          if-no-files-found: error
      - name: Fail below the line-coverage floor
        run: cargo llvm-cov report --summary-only --fail-under-lines "$COVERAGE_MIN_LINES"

  audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-audit@0.22.2
      - run: cargo audit

  # Embedded clippy (deny warnings) + release build for the nRF52840 target.
  embedded:
    name: Embedded build & clippy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      firmware-artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain + ARM target
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Clippy (embedded, deny warnings)
        run: cargo clippy --locked --features embedded --target thumbv7em-none-eabihf -- -D warnings
      # The library and the binary share the name bt2usb, so document them apart.
      - name: Build firmware documentation (deny warnings)
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --locked --no-deps --document-private-items --features embedded --target thumbv7em-none-eabihf --lib
          cargo doc --locked --no-deps --document-private-items --features embedded --target thumbv7em-none-eabihf --bin bt2usb --bin bt2usb-selftest
      - name: Build release firmware
        run: cargo build --locked --features embedded --target thumbv7em-none-eabihf --release
      # Stage outside target/: rust-cache saves and restores that directory,
      # and staging refuses a pre-existing output directory.
      - name: Stage the checked firmware and record build inputs
        run: |
          rustup component add llvm-tools
          llvm_bin="$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin"
          python scripts/release.py stage \
            --build-dir target/thumbv7em-none-eabihf/release \
            --output "$RUNNER_TEMP/release-input" \
            --objcopy "$llvm_bin/llvm-objcopy"
      - name: Upload checked firmware and build manifest
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bt2usb-checked-firmware-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-input/*
          if-no-files-found: error

  # SoftDevice-free on-target simulation (Layer 3). Boots the sim ELF in Renode
  # and asserts the coordinator + UI logic run on the simulated MCU.
  simulation:
    name: Renode simulation test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain + ARM target
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Clippy (simulation, deny warnings)
        run: cargo clippy --locked --features sim --target thumbv7em-none-eabihf -- -D warnings
      - name: Build simulation documentation (deny warnings)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --document-private-items --features sim --target thumbv7em-none-eabihf --bin bt2usb-sim
      - name: Build simulation firmware
        run: cargo build --locked --features sim --target thumbv7em-none-eabihf
      - name: Install Renode + renode-test deps
        run: bash scripts/install-renode.sh
      - name: Run headless Renode robot test
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          renode-test --results-dir "$RUNNER_TEMP/renode-results" renode/bt2usb-sim.robot
      - name: Upload simulation diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: renode-results-${{ github.run_attempt }}
          path: ${{ runner.temp }}/renode-results
          if-no-files-found: ignore

  # Reuse this run's immutable, successful embedded artifact; never rebuild
  # different bytes in a privileged release job. Signing cannot publish releases.
  release-package:
    name: Verify and attest release package
    needs: [lint-and-test, coverage, audit, embedded, simulation]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      release-artifact-id: ${{ steps.upload.outputs.artifact-id }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Validate exact release version, including prerelease
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/release.py validate-tag --tag "$RELEASE_TAG"
      - name: Download this run's successful embedded build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.embedded.outputs.firmware-artifact-id }}
          path: ${{ runner.temp }}/release-input
          digest-mismatch: error
      - name: Verify build identity, input digests, and firmware before packaging
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          python scripts/release.py package \
            --input "$RUNNER_TEMP/release-input" --output dist --tag "$RELEASE_TAG" \
            --expected-commit "$SOURCE_COMMIT" \
            --expected-repository "$SOURCE_REPOSITORY" \
            --expected-run-id "$SOURCE_RUN_ID"
      - name: Attest package provenance using GitHub OIDC
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
          create-storage-record: false
      - name: Include the signed attestation bundle
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$ATTESTATION_BUNDLE" dist/provenance.sigstore.json
      - name: Upload attested release package
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bt2usb-attested-release-${{ github.run_attempt }}
          path: dist/*
          if-no-files-found: error

  # Publication has no signing permissions and executes no checked-out scripts.
  release:
    name: Prepare draft firmware release
    needs: release-package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the verified and attested package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.release-package.outputs.release-artifact-id }}
          path: dist
          digest-mismatch: error
      # A rerun may refresh this tag's unpublished draft, but must never change
      # a release that is already published. API errors fail the job (closed).
      - name: Refuse to modify a published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          published="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.tag_name == env.RELEASE_TAG and (.draft | not)) | .html_url')"
          if [ -n "$published" ]; then
            echo "::error::$RELEASE_TAG is already published ($published). Tag a new version instead of re-running."
            exit 1
          fi
      - name: Create draft for hardware validation and review
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          prerelease: ${{ needs.release-package.outputs.prerelease == 'true' }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
